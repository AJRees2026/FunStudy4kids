<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Astronaut Suit: shoulder collar + chest panel -->
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stopColor="#334155"/>
    </linearGradient>
  </defs>
  <!-- Suit body (bottom half of frame) -->
  <path d="M 20 200 Q 20 130 60 120 L 140 120 Q 180 130 180 200 Z" fill="url(#suit)" stroke="#64748b" stroke-width="2"/>
  <!-- Neck collar -->
  <ellipse cx="100" cy="120" rx="42" ry="12" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <!-- Chest control panel -->
  <rect x="78" y="140" width="44" height="36" rx="6" fill="url(#panel)" stroke="#1e293b" stroke-width="2"/>
  <!-- Panel buttons -->
  <circle cx="88" cy="152" r="4" fill="#22c55e"/>
  <circle cx="100" cy="152" r="4" fill="#fbbf24"/>
  <circle cx="112" cy="152" r="4" fill="#ef4444"/>
  <rect x="84" y="162" width="32" height="6" rx="3" fill="#0ea5e9"/>
  <!-- Shoulder patches -->
  <circle cx="40" cy="135" r="10" fill="#3b82f6" opacity="0.7"/>
  <circle cx="160" cy="135" r="10" fill="#3b82f6" opacity="0.7"/>
</svg>
