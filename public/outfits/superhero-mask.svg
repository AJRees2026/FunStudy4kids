<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Superhero Mask: domino mask across the eyes -->
  <defs>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Mask shape -->
  <path d="M 30 78 Q 30 62 50 60 Q 100 56 150 60 Q 170 62 170 78 Q 170 96 150 98 Q 130 100 120 92 Q 110 88 100 88 Q 90 88 80 92 Q 70 100 50 98 Q 30 96 30 78 Z"
    fill="url(#mask)" stroke="#1e40af" stroke-width="2"/>
  <!-- Eye holes -->
  <ellipse cx="68" cy="80" rx="14" ry="10" fill="#0f172a"/>
  <ellipse cx="132" cy="80" rx="14" ry="10" fill="#0f172a"/>
  <!-- Eye shine -->
  <ellipse cx="70" cy="77" rx="5" ry="4" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="134" cy="77" rx="5" ry="4" fill="rgba(255,255,255,0.3)"/>
  <!-- Mask emblem on forehead -->
  <path d="M 92 62 L 100 54 L 108 62 L 100 70 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
</svg>
