<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rainbow Wings: butterfly-style wings behind the avatar -->
  <defs>
    <linearGradient id="rainbow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="rainbow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Left wing -->
  <path d="M 96 100 Q 20 40 8 100 Q 15 140 96 108 Z" fill="url(#rainbow1)" opacity="0.75" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Right wing -->
  <path d="M 104 100 Q 180 40 192 100 Q 185 140 104 108 Z" fill="url(#rainbow2)" opacity="0.75" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Wing detail lines -->
  <path d="M 96 105 Q 50 80 25 100" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none"/>
  <path d="M 96 108 Q 55 95 30 110" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 104 105 Q 150 80 175 100" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none"/>
  <path d="M 104 108 Q 145 95 170 110" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  <!-- Sparkles -->
  <g fill="#fff">
    <circle cx="30" cy="75" r="2" opacity="0.8"/>
    <circle cx="170" cy="75" r="2" opacity="0.8"/>
    <circle cx="20" cy="110" r="1.5" opacity="0.6"/>
    <circle cx="180" cy="110" r="1.5" opacity="0.6"/>
  </g>
</svg>
